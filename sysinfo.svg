<svg viewBox="0 0 460 288" xmlns="http://www.w3.org/2000/svg" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">
  <style>
    .bar { fill: #21262d; }
    .dot { }
    .titlebar { font-size: 11px; fill: #8b949e; }
    .prompt { font-size: 13px; fill: #3fb950; }
    .label { font-size: 13px; fill: #7d8590; }
    .value { font-size: 13px; fill: #e6edf3; }
    .cursor { fill: #58a6ff; }
  </style>

  <rect x="0" y="0" width="460" height="288" rx="8" fill="#0d1117" stroke="#30363d" />
  <rect x="0" y="0" width="460" height="44" rx="8" class="bar" />
  <rect x="0" y="36" width="460" height="8" class="bar" />
  <circle cx="20" cy="20" r="5" fill="#ff5f56" />
  <circle cx="38" cy="20" r="5" fill="#ffbd2e" />
  <circle cx="56" cy="20" r="5" fill="#27c93f" />
  <text x="230.0" y="24" text-anchor="middle" class="titlebar">sysinfo.sh</text>

  
    <g opacity="0" transform="translate(-14,0)">
      <animate attributeName="opacity" from="0" to="1" begin="500ms" dur="360ms" fill="freeze" />
      <animateTransform attributeName="transform" type="translate"
        from="-14,0" to="0,0" begin="500ms" dur="360ms" fill="freeze" />
      <text x="20" y="70" class="prompt">$</text>
      <text x="36" y="70" class="label">role</text>
      <text x="140" y="70" class="value">Full Stack Developer @ eClerx</text>
    </g>
    <g opacity="0" transform="translate(-14,0)">
      <animate attributeName="opacity" from="0" to="1" begin="760ms" dur="360ms" fill="freeze" />
      <animateTransform attributeName="transform" type="translate"
        from="-14,0" to="0,0" begin="760ms" dur="360ms" fill="freeze" />
      <text x="20" y="112" class="prompt">$</text>
      <text x="36" y="112" class="label">focus</text>
      <text x="140" y="112" class="value">Teams bot to ITAM asset lookups</text>
    </g>
    <g opacity="0" transform="translate(-14,0)">
      <animate attributeName="opacity" from="0" to="1" begin="1020ms" dur="360ms" fill="freeze" />
      <animateTransform attributeName="transform" type="translate"
        from="-14,0" to="0,0" begin="1020ms" dur="360ms" fill="freeze" />
      <text x="20" y="154" class="prompt">$</text>
      <text x="36" y="154" class="label">stack</text>
      <text x="140" y="154" class="value">Next.js . React . Node . Express</text>
    </g>
    <g opacity="0" transform="translate(-14,0)">
      <animate attributeName="opacity" from="0" to="1" begin="1280ms" dur="360ms" fill="freeze" />
      <animateTransform attributeName="transform" type="translate"
        from="-14,0" to="0,0" begin="1280ms" dur="360ms" fill="freeze" />
      <text x="20" y="196" class="prompt">$</text>
      <text x="36" y="196" class="label">exploring</text>
      <text x="140" y="196" class="value">LangChain, HuggingFace, prompt design</text>
    </g>
    <g opacity="0" transform="translate(-14,0)">
      <animate attributeName="opacity" from="0" to="1" begin="1540ms" dur="360ms" fill="freeze" />
      <animateTransform attributeName="transform" type="translate"
        from="-14,0" to="0,0" begin="1540ms" dur="360ms" fill="freeze" />
      <text x="20" y="238" class="prompt">$</text>
      <text x="36" y="238" class="label">now</text>
      <text x="140" y="238" class="value">IT induction deck redesign</text>
    </g>

  <rect x="20" y="269" width="7" height="13" class="cursor">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"
      begin="1800ms" />
  </rect>
</svg>